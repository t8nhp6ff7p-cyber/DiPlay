name: Build MotoPlay Custom APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply MotoPlay Motorcycle Customizations
        run: |
          echo "Applying MotoPlay customizations..."
          # 1. Rebrand to MotoPlay
          sed -i 's/<string name="app_name">DiPlay<\/string>/<string name="app_name">MotoPlay<\/string>/g' mobile/src/main/res/values/strings.xml
          # 2. Glove-friendly 125% interface scale
          sed -i 's/getInt(KEY, AUTO)/getInt(KEY, 125)/g' common/src/main/java/com/shilapi/xcertplay/InterfaceSize.kt
          # 3. Auto-start on motorcycle boot
          sed -i 's/getBoolean(KEY_AUTO_START_ON_BOOT, false)/getBoolean(KEY_AUTO_START_ON_BOOT, true)/g' common/src/main/java/com/shilapi/xcertplay/AirPlayPersistence.kt
          # 4. Low-latency decoder for Snapdragon 865
          sed -i 's/getBoolean(KEY_LOW_LATENCY_DECODER, false)/getBoolean(KEY_LOW_LATENCY_DECODER, true)/g' common/src/main/java/com/shilapi/xcertplay/AirPlayPersistence.kt
          # 5. Smooth video enabled
          sed -i 's/getBoolean(KEY_SMOOTH_VIDEO, false)/getBoolean(KEY_SMOOTH_VIDEO, true)/g' common/src/main/java/com/shilapi/xcertplay/AirPlayPersistence.kt
          git diff

      - name: Extract MFi CarPlay runtime authentication assets
        run: |
          mkdir -p runtime-assets/offline-mfi
          curl -L -o official.apk https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.21/DiPlay-0.2.21.apk
          unzip -j official.apk "assets/offline-mfi/*" -d runtime-assets/offline-mfi/
          ls -la runtime-assets/offline-mfi/

      - name: Build MotoPlay Standalone APK
        run: |
          DIPLAY_AUTH_ASSETS_DIR=$(pwd)/runtime-assets ./gradlew :mobile:assembleStandaloneDebug --stacktrace

      - name: Prepare custom APK package
        run: |
          cp mobile/build/outputs/apk/debug/mobile-debug.apk MotoPlay-S20FE-MotoEdition.apk

      - name: Upload MotoPlay APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotoPlay-S20FE-MotoEdition-APK
          path: MotoPlay-S20FE-MotoEdition.apk
